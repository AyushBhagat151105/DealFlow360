name: DealFlow360

services:
  postgres:
    image: postgres:16-alpine
    container_name: DealFlow360-postgres
    environment:
      POSTGRES_DB: DealFlow360
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - DealFlow360_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  DealFlow360_postgres_data:
